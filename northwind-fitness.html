<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northwind Fitness — Train with a crew</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#0d1622;--mute:#5b6878;--blue:#1f5cff;--lime:#c9ff3d;--line:#d9e0e8;
--head:"Archivo","Arial Narrow",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111a;--card:#131c29;--ink:#eef3f9;--mute:#94a3b8;--line:#243044}}
:root[data-theme="dark"]{--bg:#0b111a;--card:#131c29;--ink:#eef3f9;--mute:#94a3b8;--line:#243044}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);overflow-x:hidden}
a{color:inherit}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(18px,5vw,56px);max-width:1200px;margin:0 auto}
.logo{font:900 1.4rem var(--head);font-stretch:125%;letter-spacing:-.04em;text-decoration:none}
.logo i{color:var(--blue);font-style:normal}
.hero{max-width:1200px;margin:0 auto;padding:clamp(30px,7vw,90px) clamp(18px,5vw,56px)}
h1{font:900 clamp(3rem,11vw,9rem)/.86 var(--head);font-stretch:110%;letter-spacing:-.05em;margin:0 0 26px;text-transform:uppercase}
h1 span{background:var(--lime);color:#0d1622;padding:0 .12em;border-radius:.08em}
.hero p{max-width:46ch;color:var(--mute);font-size:1.15rem}
.btn{display:inline-block;background:var(--blue);color:#fff;padding:14px 28px;border-radius:12px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font:inherit;font-weight:600;transition:transform 100ms ease-out}
.btn:active{transform:scale(.96)}
section{max-width:1200px;margin:0 auto;padding:clamp(40px,7vw,80px) clamp(18px,5vw,56px)}
h2{font:800 clamp(1.8rem,4.5vw,3.2rem)/1 var(--head);letter-spacing:-.04em;margin:0 0 24px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px}
.days button{flex:0 0 auto;font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;cursor:pointer;transition:transform 100ms ease-out}
.days button:active{transform:scale(.94)}
.days button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.classes{display:grid;gap:12px}
.cls{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.cls time{font:800 1.3rem var(--head)}
.cls h3{margin:0;font:700 1.15rem var(--head)}.cls p{margin:0;color:var(--mute);font-size:.92rem}
.book{font:inherit;font-weight:600;border:2px solid var(--blue);color:var(--blue);background:none;border-radius:10px;padding:8px 18px;cursor:pointer;min-width:112px;transition:transform 100ms ease-out,background .2s}
.book:active{transform:scale(.95)}
.book[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#0d1622}
.book:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line);color:var(--mute)}
.bill{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:24px}
.bill button{font:inherit;font-weight:600;background:none;border:0;color:var(--ink);padding:8px 20px;border-radius:9px;cursor:pointer}
.bill button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.plan.hot{background:var(--blue);color:#fff;border-color:var(--blue)}
.plan h3{font:800 1.2rem var(--head);margin:0 0 8px}
.plan .pr{font:900 3rem var(--head);letter-spacing:-.05em}.plan .pr small{font:500 1rem var(--body);opacity:.7}
.plan ul{padding-left:18px;margin:14px 0 0;color:inherit;opacity:.85}
footer{text-align:center;padding:40px 20px calc(40px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:.9rem}
#msg{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:12px;font-weight:600;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
#msg.show{transform:translate(-50%,0)}
@media(max-width:600px){.cls{grid-template-columns:70px 1fr;}.cls .book{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#msg{transition:none}}
</style></head><body>
<header><a class="logo" href="#">NORTH<i>WIND</i></a><a class="btn" href="#classes" style="padding:10px 20px">Book a class</a></header>
<div class="hero"><h1>Train <span>hard.</span><br>Rest well.</h1><p>Small classes, real coaches, and a schedule that fits around your week. First class is free.</p><a class="btn" href="#classes">See this week’s classes</a></div>
<section id="classes"><h2>Book your spot</h2><div class="days" id="days" role="tablist"></div><div class="classes" id="list"></div></section>
<section><h2>Membership</h2><div class="bill" role="group" aria-label="Billing period"><button id="m" aria-pressed="true">Monthly</button><button id="y" aria-pressed="false">Yearly · save 20%</button></div><div class="plans" id="plans"></div></section>
<footer>Concept project by PairwiseUI — a sample website, not a real gym.</footer>
<div id="msg" role="status"></div>
<script>
var days=["Mon","Tue","Wed","Thu","Fri","Sat"],C=[["06:30","Strength Basics","Coach Ana · 45 min",10],["09:00","HIIT Express","Coach Mark · 30 min",8],["12:15","Mobility Flow","Coach Ivy · 40 min",0],["18:00","Boxing Fundamentals","Coach Dani · 60 min",12],["19:30","Spin Night","Coach Leo · 45 min",6]];
var state={d:0,booked:{}},$=function(i){return document.getElementById(i)},yearly=false;
function toast(t){var e=$("msg");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("show")},1800)}
function draw(){$("days").innerHTML=days.map(function(d,i){return '<button role="tab" aria-selected="'+(i===state.d)+'" data-d="'+i+'">'+d+'</button>'}).join("");
$("list").innerHTML=C.map(function(c,i){var k=state.d+"-"+i,full=c[3]===0,b=state.booked[k];return '<div class="cls"><time>'+c[0]+'</time><div><h3>'+c[1]+'</h3><p>'+c[2]+' · '+(full?"Full":c[3]-(b?1:0)+" spots left")+'</p></div><button class="book" data-k="'+k+'" aria-pressed="'+!!b+'"'+(full?" disabled":"")+'>'+(full?"Full":b?"Booked ✓":"Book")+'</button></div>'}).join("")}
function plans(){var P=[["Off-peak",29,["Classes 6:00 – 16:00","Open gym access"]],["Unlimited",49,["All classes, any time","Open gym and sauna","1 guest pass a month"],1],["Duo",85,["Two members, one plan","All classes","Shared guest passes"]]];
$("plans").innerHTML=P.map(function(p){var v=yearly?Math.round(p[1]*.8):p[1];return '<div class="plan'+(p[3]?" hot":"")+'"><h3>'+p[0]+'</h3><div class="pr">$'+v+'<small> / month</small></div><ul>'+p[2].map(function(x){return "<li>"+x+"</li>"}).join("")+'</ul></div>'}).join("")}
document.addEventListener("click",function(e){var t=e.target;
if(t.dataset.d!==undefined){state.d=+t.dataset.d;draw()}
if(t.dataset.k){var k=t.dataset.k;if(state.booked[k]){delete state.booked[k];toast("Booking cancelled")}else{state.booked[k]=1;toast("You’re in. See you there!")}draw()}});
$("m").onclick=function(){yearly=false;$("m").setAttribute("aria-pressed",true);$("y").setAttribute("aria-pressed",false);plans()};
$("y").onclick=function(){yearly=true;$("y").setAttribute("aria-pressed",true);$("m").setAttribute("aria-pressed",false);plans()};
draw();plans();
</script></body></html>
